[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsaudit"
version = "0.2.1"
description = "Audit disparities in operational ML systems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "Ram Charan Polisetti"}]
keywords = ["ai governance", "algorithmic fairness", "operations analytics", "responsible ai", "supply chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pandas>=2.0", "numpy>=1.24", "click>=8.0", "jinja2>=3.0", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/ram-polisetti/opsaudit"
Repository = "https://github.com/ram-polisetti/opsaudit"
Issues = "https://github.com/ram-polisetti/opsaudit/issues"
Changelog = "https://github.com/ram-polisetti/opsaudit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
release = ["build>=1.2", "twine>=5.1"]
# Optional HTTP client for the v0.2 LLM target adapters (Ollama,
# OpenAI-compatible endpoints). Kept out of the core dependencies so the
# base package stays dependency-light; adapters import it lazily.
llm = ["httpx>=0.27"]

[project.scripts]
opsaudit = "opsaudit.cli:main"

[tool.ruff.lint]
# TRY004 (prefer TypeError over ValueError for type errors) is intentionally
# off: this codebase raises ValueError for ALL argument-validation failures
# (wrong type or bad value) and 60+ tests pin that contract. Splitting the
# two exception types would churn the public error surface for no audit
# benefit.
ignore = ["TRY004"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
