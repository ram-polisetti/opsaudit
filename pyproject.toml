[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsaudit"
version = "0.1.0"
description = "Audit disparities in operational ML systems"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Ram Charan Polisetti"}]
dependencies = ["pandas>=2.0", "numpy>=1.24", "click>=8.0", "jinja2>=3.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
opsaudit = "opsaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
